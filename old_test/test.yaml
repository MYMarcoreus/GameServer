logs:
  - name: global
    level: 1
    formatter: "[%d] [%p] [%f:%l]%T%m%n"
    appender:
      - type: 1
        level: 2
        file: /home/log/sftest_root_log.txt
      - type: 0
  - name: system
    level: 4
    formatter: "[%d] [%p] [%f]%T%m%n"
    appender:
      - type: 1
        file: /home/log/sftest_system_log.txt

system:
  port: 8088