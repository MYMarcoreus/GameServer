/*********** 消息体 ***********/


message S2CXorBody {
    uint32 xor_code = 1;
}

message HeartBody
{

}

message C2SSecurityBody {
    uint32 app_id      = 1;
    uint32 app_version = 2;
    string app_md5     = 3;
}
message S2CSecurityBody {
    enum ResultCode {
        eSuccess          = 0;
        eAppVersionFailed = 1;
        eMd5Failed        = 2;
    }
    ResultCode result_code  = 1;
    optional uint32 server_udp_port  = 2;
    optional uint64 session_id = 3; // 长度为32的连接标识，仅在 eSuccess 时使用
}

message C2SUdpPortRegister  {
    uint64 session_id = 1;
    string client_udp_ip  = 2;
    uint32 client_udp_port  = 3;
}
message S2CUdpPortRegister {
    enum Status {
        eSuccess = 0;
        eInvalidPort = 1;
        eDuplicatePort = 2;
    }
    Status status = 1;
}

//message S2SMessageRegister