syntax = "proto3";
package yy.protocol.app;



message PlayerBaseData
{
    uint64     uid         = 1;
    int32      state       = 3;
    int32      hp_current  = 4;
    int32      hp_max      = 5;
    PlayerMove movement    = 6;
    PlayerJumpAndGravity jump_and_gravity = 7;
}
message PlayerMove
{
    bytes       position = 2;
    bytes       rotation = 3;
    float       ani_speed = 5;
    float       ani_motion_speed = 6;
//    bytes       move_target = 4;
}
message PlayerJumpAndGravity
{
    bool     ani_is_jump = 2;
    bool     ani_is_ground = 3;
    bool     ani_is_freefall = 4;
}

//! 客户端发送和接收
message C2SPlayerLeave
{
    uint64   leaver_uid = 1;
};


//! 客户端发送自己的移动数据，服务端验证，然后返回让客户端接收
message C2SMove
{
    uint64      uid = 1;
    PlayerMove movement = 2;
}
//! 客户端接收其它玩家的移动
message S2CMove
{
    uint64      uid = 1;
    PlayerMove  movement = 2;
}


//! 客户端发送自己的跳跃数据，服务端验证，然后返回让客户端接收
message C2SJumpAndGravity
{
    uint64      uid = 1;
    PlayerJumpAndGravity jump_and_gravity = 2;
}
//! 客户端接收其它玩家的跳跃
message S2CJumpAndGravity
{
    uint64      uid = 1;
    PlayerJumpAndGravity jump_and_gravity = 2;
}


//! 客户端登录成功申请进入场景
message C2SEnterScene
{
    uint64  uid   = 1;
}
//! 服务器端返回给客户端的登录结果
message S2CEnterScene
{
    uint64  uid = 1;
    bool   result = 2;
    PlayerBaseData self_data = 3;
    repeated PlayerBaseData other_datas = 4;
}


//! 如果收到其它玩家的移动或跳跃数据，但是没有该玩家的基础数据，则先请求之
message C2SOtherPlayerData
{
    uint64     requester_uid        = 1;
    uint64     requested_uid        = 2;
}

//! 如果收到其它玩家的移动或跳跃数据，但是没有该玩家的基础数据，则先请求之
message S2COtherPlayerData
{
    PlayerBaseData other_data = 1;
}


